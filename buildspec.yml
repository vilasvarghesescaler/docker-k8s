version: 0.2

env:
  variables:
    AWS_REGION: "us-east-1"
    ECR_REPO_NAME: "docker-k8s"
    IMAGE_TAG: "latest"
    EKS_CLUSTER_NAME: "YOUR_EKS_CLUSTER_NAME"   # <-- CHANGE THIS

  parameter-store:
    AWS_ACCOUNT_ID: "396982710430"     # optional (you may remove)

phases:
  install:
    commands:
      - echo "===== INSTALL PHASE (Ubuntu) ====="
      - echo "Updating apt index..."
      - apt-get update -y

      # Install docker CLI if not present
      - |
        if ! command -v docker >/dev/null 2>&1; then
          echo "Installing Docker..."
          apt-get install -y docker.io
        fi

      # Install Maven if not present
      - |
        if ! command -v mvn >/dev/null 2>&1; then
          echo "Installing Maven..."
          apt-get install -y maven
        fi

      # Install kubectl
      - |
        if ! command -v kubectl >/dev/null 2>&1; then
          echo "Installing kubectl..."
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mv kubectl /usr/local/bin/
        fi

      - echo "Tool versions:"
      - docker --version
      - mvn -version
      - kubectl version --client --short

  pre_build:
    commands:
      - echo "===== PRE-BUILD PHASE ====="

      # Login to ECR
      - echo "Logging into ECR..."
      - aws ecr get-login-password --region "$AWS_REGION" \
          | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      # Ensure ECR repo exists
      - echo "Checking ECR repository..."
      - aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" --region "$AWS_REGION" \
          || aws ecr create-repository --repository-name "$ECR_REPO_NAME" --region "$AWS_REGION"

      - echo "Running Maven Package..."
      - mvn -B clean package -DskipTests

  build:
    commands:
      - echo "===== BUILD DOCKER IMAGE ====="
      - export IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME:$IMAGE_TAG"
      - echo "IMAGE_URI=$IMAGE_URI"

      - docker build -t "$ECR_REPO_NAME:$IMAGE_TAG" .
      - docker tag "$ECR_REPO_NAME:$IMAGE_TAG" "$IMAGE_URI"

  post_build:
    commands:
      - echo "===== PUSH & DEPLOY ====="

      # Push image
      - docker push "$IMAGE_URI"

      # Setup kubeconfig
      - echo "Configuring kubectl..."
      - aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      # Update YAML image tag
      - echo "Updating deployment YAML..."
      - sed -i "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" yaml/deployment.yaml

      # Apply manifests
      - echo "Applying Kubernetes manifests..."
      - kubectl apply -f yaml/deployment.yaml

      - echo "Waiting for rollout..."
      - kubectl rollout status deployment/docker-k8s-app --timeout=180s \
        || (echo "Rollout failed. Printing pods..."; kubectl get pods -o wide; exit 1)

artifacts:
  files:
    - target/*.jar
