name: CI execution

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
    # ----------------------------------------------------
    # 1. Checkout
    # ----------------------------------------------------
    - name: Checkout source code
      uses: actions/checkout@v4

    # ----------------------------------------------------
    # 2. Setup Java
    # ----------------------------------------------------
    - name: Set up Java 11
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '11'
        cache: maven

    # ----------------------------------------------------
    # 3. Linting (Checkstyle via Maven)
    # ----------------------------------------------------
    - name: Run Maven Checkstyle (Linting)
      run: mvn checkstyle:check
      continue-on-error: true

    # ----------------------------------------------------
    # 4. SAST – CodeQL
    # ----------------------------------------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: java

    - name: CodeQL Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

    # ----------------------------------------------------
    # 5. SCA – Dependency Vulnerability Scan
    # ----------------------------------------------------
    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: "maven-app"
        path: "."
        format: "HTML"
      continue-on-error: true

    # ----------------------------------------------------
    # 6. Unit Testing
    # ----------------------------------------------------
    - name: Run Unit Tests
      run: mvn test

    # ----------------------------------------------------
    # 7. Build Application
    # ----------------------------------------------------
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # ----------------------------------------------------
    # 8. Docker Build
    # ----------------------------------------------------
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        docker build -t vilasvarghese/test:latest .

    # ----------------------------------------------------
    # 9. Docker Container Basic Testing
    # ----------------------------------------------------
    - name: Run container and test
      run: |
        docker run -d -p 8080:8080 --name test-app vilasvarghese/test:latest
        sleep 10
        curl -f http://localhost:8080 || exit 1
        docker logs test-app
        docker stop test-app
        docker rm test-app

    # ----------------------------------------------------
    # 10. Login to DockerHub
    # ----------------------------------------------------
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # ----------------------------------------------------
    # 11. Push Docker Image
    # ----------------------------------------------------
    - name: Push Image to DockerHub
      run: |
        docker push vilasvarghese/test:latest
